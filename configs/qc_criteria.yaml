# Quality control criteria for NeuroGraph-X.
#
# THESE CRITERIA ARE FIXED IN ADVANCE.
# Rater and completeness gates recorded: 2026-09-28.
# Motion column and threshold finalised: 2026-10-06, from the observed distribution
# in docs/reports/metadata_report.md, before any model was trained on ABIDE.
# Changing them after seeing a result invalidates every number downstream.
# See docs/decisions/0003-qc-criteria.md
#
# Rater column values come from the ABIDE Preprocessed phenotypic file.
# The accepted values below follow the convention used by
# nilearn.datasets.fetch_abide_pcp(quality_checked=True), version 0.14.1.

rater_criteria:
  qc_rater_1:       ["OK"]
  qc_anat_rater_2:  ["OK", "maybe"]
  qc_func_rater_2:  ["OK", "maybe"]
  qc_anat_rater_3:  ["OK"]
  qc_func_rater_3:  ["OK"]

# Mean framewise displacement, in millimetres. Column confirmed present in the
# phenotypic file (metadata report, section 7). A missing value fails the gate.
motion:
  column: func_mean_fd
  mean_fd_max: 0.5

completeness:
  require_derivative_present: true
  require_nonempty_timeseries: true
